name: Inject Trace sync
on:
  push:
    branches: [main]
    paths:
      - 'supabase-sync.js'
      - '.github/workflows/inject-supabase-sync.yml'
jobs:
  inject:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Inject sync script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          tag='<script src="./supabase-sync.js"></script>'
          if tag not in s:
              s=s.replace('</head>', tag+'</head>', 1)
              p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || (git commit -m 'Add cross-device database sync [skip ci]' && git push)
