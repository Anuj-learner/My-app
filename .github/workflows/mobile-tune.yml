name: Tune mobile UI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mobile-tune.yml'

permissions:
  contents: write

jobs:
  tune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make mobile UI more compact
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          compact = '''@media(max-width:560px){
          .wrap{padding:18px 12px 42px}
          .nav{padding:8px 12px}
          .brand{font-size:16px}.logo{width:31px;height:31px;border-radius:10px}
          .tabs button{padding:7px 9px;font-size:12px}
          h1{font-size:25px;line-height:1.12}
          .top{gap:10px}
          .btn{padding:8px 10px;font-size:12px}
          .stats{grid-template-columns:1fr 1fr;gap:10px}
          .card{padding:14px;border-radius:15px}
          .hero{min-height:160px}
          .hero b{font-size:23px;margin-top:19px}
          .big{font-size:32px;margin-top:18px}
          .orbit{grid-template-columns:repeat(2,1fr);gap:10px}
          .activity{min-height:102px;padding:14px}
          .activity .e{font-size:20px;margin-bottom:11px}
          .activity b{font-size:12px}
          .small{font-size:10px}
          .lower{gap:10px}
          .row{grid-template-columns:45px 28px 1fr auto;gap:7px;padding:10px 0}
          .tag{width:28px;height:28px}
          .desc b{font-size:11px}.desc small{font-size:9px}
          .matrix{gap:2px}
          .journal .editor{min-height:560px}
          .editor input{font-size:21px;padding-bottom:10px}
          .editor textarea{font-size:14px;line-height:1.75;min-height:400px;padding:18px 2px}
          .editor select{padding:7px;font-size:10px}
          .side{gap:10px}
          .prompt{font-size:14px}
          .entry{padding:10px}
          .modalbox{padding:17px}
          }'''
          s = re.sub(r'@media\(max-width:560px\)\{.*?\}\s*</style>', compact + '</style>', s, count=1, flags=re.S)
          p.write_text(s, encoding='utf-8')
      - name: Commit the mobile tune and remove this one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/mobile-tune.yml
          git commit -m "Make mobile UI more compact"
          git push

# one-shot mobile refinement
