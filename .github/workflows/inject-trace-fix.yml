name: Remove legacy Trace fix
on:
  push:
    branches: [main]
    paths:
      - 'trace-fix.js'
      - '.github/workflows/inject-trace-fix.yml'
jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Remove legacy script injection
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('<script src="./trace-fix.js"></script>', '')
          p.write_text(s)
          PY
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || (git commit -m 'Remove legacy Trace auth sync injection [skip ci]' && git push)
