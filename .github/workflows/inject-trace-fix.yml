name: Inject Trace fixes
on:
  push:
    branches: [main]
    paths:
      - 'trace-fix.js'
      - '.github/workflows/inject-trace-fix.yml'
jobs:
  inject:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Inject fix script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          tag='<script src="./trace-fix.js"></script>'
          if tag not in s:
              s=s.replace('</body>', tag+'</body>', 1)
              p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || (git commit -m 'Fix Trace activity logging and sync [skip ci]' && git push)
